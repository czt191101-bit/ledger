<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账">
<meta name="theme-color" content="#2f7cf6">
<title>我的记账本</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f3f5; color: #1a1a1a; padding-bottom: env(safe-area-inset-bottom); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
header { position: sticky; top: 0; z-index: 10; background: #2f7cf6; color: #fff; padding: calc(env(safe-area-inset-top) + 12px) 16px 16px; border-radius: 0 0 20px 20px; }
.month-bar { display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 16px; margin-bottom: 14px; }
.month-bar button { background: rgba(255,255,255,.2); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1; }
.totals { display: flex; gap: 10px; }
.totals > div { flex: 1; background: rgba(255,255,255,.15); border-radius: 12px; padding: 10px 12px; }
.totals .label { font-size: 12px; opacity: .85; }
.totals .val { font-size: 18px; font-weight: 700; margin-top: 2px; word-break: break-all; }
.tabs { display: flex; background: #fff; margin: 12px 12px 0; border-radius: 12px; padding: 4px; }
.tabs button { flex: 1; border: none; background: none; padding: 10px; border-radius: 8px; font-size: 14px; color: #666; }
.tabs button.on { background: #eef3ff; color: #2f7cf6; font-weight: 600; }
main { padding: 12px 12px 100px; }
.day-group { margin-bottom: 14px; }
.day-head { font-size: 12px; color: #888; margin: 0 4px 6px; display: flex; justify-content: space-between; }
.item { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; transition: transform .1s; }
.item:active { transform: scale(.98); }
.item .cat { width: 40px; height: 40px; border-radius: 12px; background: #eef3ff; color: #2f7cf6; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.item.income .cat { background: #e8f7ee; color: #2f9e44; }
.item .info { flex: 1; min-width: 0; }
.item .info .note { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .info .sub { font-size: 12px; color: #999; margin-top: 2px; }
.item .amt { font-weight: 700; font-size: 16px; white-space: nowrap; }
.item.expense .amt { color: #e5484d; }
.item.income .amt { color: #2f9e44; }
.empty { text-align: center; color: #aaa; padding: 60px 0; font-size: 14px; }
.stats { padding: 12px; padding-bottom: 100px; }
.stats-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.stats-card h3 { margin: 0 0 12px; font-size: 15px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
.bar-row .name { width: 48px; color: #555; flex-shrink: 0; }
.bar-row .bar-wrap { flex: 1; height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
.bar-row .bar { height: 100%; background: #2f7cf6; border-radius: 4px; transition: width .3s; }
.bar-row .pct { width: 70px; text-align: right; color: #888; font-size: 12px; flex-shrink: 0; }
#pieChart { display: block; margin: 0 auto; max-width: 260px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; font-size: 12px; justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.add-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid #eee; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; max-width: 640px; margin: 0 auto; }
.add-bar input.amount { flex: 1; min-width: 0; border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px; font-size: 18px; font-weight: 600; background: #fafafa; }
.add-bar button { background: #2f7cf6; color: #fff; border: none; border-radius: 10px; padding: 0 18px; height: 44px; font-size: 15px; font-weight: 600; }
.add-bar button:active { opacity: .8; }
.sheet-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; z-index: 100; }
.sheet-mask.show { display: flex; }
.sheet { width: 100%; background: #fff; border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .2s ease; max-height: 90vh; overflow-y: auto; }
@keyframes up { from { transform: translateY(100%); } }
.sheet h3 { margin: 0 0 14px; font-size: 16px; text-align: center; }
.seg { display: flex; background: #f2f3f5; border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: none; background: none; padding: 9px; border-radius: 8px; font-size: 14px; color: #666; }
.seg button.on { background: #fff; color: #2f7cf6; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.sheet label { display: block; font-size: 12px; color: #888; margin: 10px 0 4px; }
.sheet input, .sheet select { width: 100%; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px; font-size: 16px; background: #fafafa; font-family: inherit; }
.btns { display: flex; gap: 10px; margin-top: 16px; }
.btns button { flex: 1; height: 48px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; }
.btns .cancel { background: #f2f3f5; color: #444; }
.btns .ok { background: #2f7cf6; color: #fff; }
.btns .del { background: #fff; color: #e5484d; border: 1px solid #ffd6d8; flex: 0 0 90px; }
</style>
</head>
<body>
<header>
  <div class="month-bar">
    <button id="prevM">‹</button>
    <span id="monthLabel">—</span>
    <button id="nextM">›</button>
  </div>
  <div class="totals">
    <div><div class="label">支出</div><div class="val" id="sumExp">¥0</div></div>
    <div><div class="label">收入</div><div class="val" id="sumInc">¥0</div></div>
    <div><div class="label">结余</div><div class="val" id="sumBal">¥0</div></div>
  </div>
</header>
<div class="tabs">
  <button id="tabList" class="on">明细</button>
  <button id="tabStats">统计</button>
  <button id="btnExport" style="flex:0 0 60px;color:#888">导出</button>
  <button id="btnImport" style="flex:0 0 60px;color:#888">导入</button>
</div>
<main id="list"></main>
<div id="stats" class="stats" style="display:none"></div>
<input type="file" id="fileInput" accept=".json" style="display:none">
<div class="add-bar">
  <input class="amount" id="quickAmt" type="number" inputmode="decimal" placeholder="0.00" step="0.01">
  <button id="quickAdd">记一笔</button>
</div>
<div class="sheet-mask" id="mask">
  <div class="sheet">
    <h3 id="sheetTitle">记一笔</h3>
    <div class="seg">
      <button data-type="expense" class="on">支出</button>
      <button data-type="income">收入</button>
    </div>
    <label>金额</label>
    <input id="sAmount" type="number" inputmode="decimal" step="0.01">
    <label>分类</label>
    <select id="sCat"></select>
    <label>日期</label>
    <input id="sDate" type="date">
    <label>备注</label>
    <input id="sNote" placeholder="选填">
    <div class="btns">
      <button class="cancel" id="sCancel">取消</button>
      <button class="del" id="btnDelete" style="display:none">删除</button>
      <button class="ok" id="sOk">保存</button>
    </div>
  </div>
</div>
<script>
const KEY = 'my_ledger_v1';
let records = JSON.parse(localStorage.getItem(KEY) || '[]');
const CATS = {
  expense: ['餐饮','交通','购物','居住','娱乐','医疗','学习','人情','其他'],
  income:  ['工资','兼职','理财','红包','其他']
};
const COLORS = ['#2f7cf6','#ff922b','#845ef7','#20c997','#f06595','#ffd43b','#5c7cfa','#e5484d','#868e96'];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmt = n => n.toFixed(2);
function save() { localStorage.setItem(KEY, JSON.stringify(records)); }
let viewMonth = today().slice(0, 7);
let currentTab = 'list'; 
let editingId = null;    
let sheetType = 'expense';
function renderList() {
  const [y, m] = viewMonth.split('-');
  $('monthLabel').textContent = `${y}年${Number(m)}月`;
  const list = records.filter(r => r.date.startsWith(viewMonth)).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  let exp = 0, inc = 0;
  list.forEach(r => r.type === 'expense' ? exp += r.amount : inc += r.amount);
  $('sumExp').textContent = '¥' + fmt(exp);
  $('sumInc').textContent = '¥' + fmt(inc);
  $('sumBal').textContent = '¥' + fmt(inc - exp);
  if (!list.length) {
    $('list').innerHTML = '<div class="empty">这个月还没有记录<br>在底部输入金额记一笔吧</div>';
    return;
  }
  const groups = {};
  list.forEach(r => (groups[r.date] ||= []).push(r));
  $('list').innerHTML = Object.entries(groups).map(([date, items]) => {
    const dayExp = items.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
    const dayInc = items.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
    const dayLabel = date === today() ? '今天' : date.slice(5);
    const total = [dayExp ? `支出 ¥${fmt(dayExp)}` : '', dayInc ? `收入 ¥${fmt(dayInc)}` : ''].filter(Boolean).join(' · ');
    return `<div class="day-group">
      <div class="day-head"><span>${dayLabel}</span><span>${total}</span></div>
      ${items.map(r => `
        <div class="item ${r.type}" data-id="${r.id}">
          <div class="cat">${r.category}</div>
          <div class="info">
            <div class="note">${escapeHtml(r.note || r.category)}</div>
            <div class="sub">${r.category}</div>
          </div>
          <div class="amt">${r.type === 'expense' ? '-' : '+'}¥${fmt(r.amount)}</div>
        </div>`).join('')}
    </div>`;
  }).join('');
}
function renderStats() {
  const list = records.filter(r => r.date.startsWith(viewMonth));
  const expList = list.filter(r => r.type === 'expense');
  const totalExp = expList.reduce((s, r) => s + r.amount, 0);
  if (!totalExp) {
    $('stats').innerHTML = '<div class="stats-card"><div class="empty">本月暂无支出数据</div></div>';
    return;
  }
  const byCat = {};
  expList.forEach(r => byCat[r.category] = (byCat[r.category] || 0) + r.amount);
  const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const pieHtml = `<canvas id="pieChart" width="260" height="260"></canvas>
    <div class="legend">${sorted.map(([cat], i) => `<span><i style="background:${COLORS[i % COLORS.length]}"></i>${cat}</span>`).join('')}</div>`;
  const barsHtml = sorted.map(([cat, amt], i) => {
    const pct = (amt / totalExp * 100);
    return `<div class="bar-row">
      <span class="name">${cat}</span>
      <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${COLORS[i % COLORS.length]}"></div></div>
      <span class="pct">¥${fmt(amt)}<br><small>${pct.toFixed(1)}%</small></span>
    </div>`;
  }).join('');
  $('stats').innerHTML = `
    <div class="stats-card"><h3>本月支出总额</h3><div style="font-size:26px;font-weight:700;color:#e5484d">¥${fmt(totalExp)}</div></div>
    <div class="stats-card"><h3>分类占比</h3>${pieHtml}</div>
    <div class="stats-card"><h3>分类明细</h3>${barsHtml}</div>
  `;
  drawPie(sorted, totalExp);
}
function drawPie(sorted, total) {
  const canvas = $('pieChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const cx = 130, cy = 130, R = 110;
  let start = -Math.PI / 2;
  sorted.forEach(([cat, amt], i) => {
    const angle = (amt / total) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, start, start + angle); ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
    start += angle;
  });
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.55, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
}
function openSheet(amountOrRecord) {
  editingId = null; sheetType = 'expense'; let amount = '', note = '', date = today(), category = CATS.expense[0];
  if (amountOrRecord && typeof amountOrRecord === 'object') {
    const r = amountOrRecord; editingId = r.id; sheetType = r.type; amount = r.amount; note = r.note || ''; date = r.date; category = r.category;
  } else if (typeof amountOrRecord === 'number') { amount = amountOrRecord; }
  $('sAmount').value = amount; $('sNote').value = note; $('sDate').value = date;
  $('sheetTitle').textContent = editingId ? '编辑记录' : '记一笔';
  $('btnDelete').style.display = editingId ? 'block' : 'none';
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.type === sheetType));
  refreshCats(category);
  $('mask').classList.add('show');
  if (!amount) setTimeout(() => $('sAmount').focus(), 100);
}
function refreshCats(selected) {
  $('sCat').innerHTML = CATS[sheetType].map(c => `<option${c === selected ? ' selected' : ''}>${c}</option>`).join('');
}
document.querySelectorAll('.seg button').forEach(btn => {
  btn.onclick = () => {
    sheetType = btn.dataset.type;
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b === btn));
    refreshCats();
  };
});
$('sOk').onclick = () => {
  const amt = parseFloat($('sAmount').value);
  if (!amt || amt <= 0) { alert('请输入有效金额'); return; }
  const rec = { id: editingId || Date.now(), date: $('sDate').value || today(), amount: amt, type: sheetType, category: $('sCat').value, note: $('sNote').value.trim() };
  if (editingId) { records = records.map(r => r.id === editingId ? rec : r); } else { records.push(rec); }
  save(); viewMonth = rec.date.slice(0, 7); $('mask').classList.remove('show'); $('quickAmt').value = ''; renderAll();
};
$('btnDelete').onclick = () => {
  if (!editingId) return; if (!confirm('删除这条记录？')) return;
  records = records.filter(r => r.id !== editingId); save(); $('mask').classList.remove('show'); renderAll();
};
$('sCancel').onclick = () => $('mask').classList.remove('show');
$('mask').onclick = e => { if (e.target === $('mask')) $('mask').classList.remove('show'); };
$('quickAdd').onclick = () => { const v = $('quickAmt').value; openSheet(v ? parseFloat(v) : null); };
$('list').onclick = e => {
  const el = e.target.closest('.item'); if (!el) return;
  const rec = records.find(r => r.id === Number(el.dataset.id)); if (rec) openSheet(rec);
};
$('prevM').onclick = () => changeMonth(-1);
$('nextM').onclick = () => changeMonth(1);
function changeMonth(delta) {
  const [y, m] = viewMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  viewMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  renderAll();
}
$('tabList').onclick = () => switchTab('list');
$('tabStats').onclick = () => switchTab('stats');
function switchTab(tab) {
  currentTab = tab;
  $('tabList').classList.toggle('on', tab === 'list');
  $('tabStats').classList.toggle('on', tab === 'stats');
  $('list').style.display = tab === 'list' ? '' : 'none';
  $('stats').style.display = tab === 'stats' ? '' : 'none';
  renderAll();
}
$('btnExport').onclick = () => {
  const data = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), records }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `记账备份-${today()}.json`; a.click(); URL.revokeObjectURL(url);
};
$('btnImport').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result); const imported = Array.isArray(data) ? data : data.records;
      if (!Array.isArray(imported)) throw new Error('格式错误');
      if (!confirm(`将导入 ${imported.length} 条记录，是否覆盖当前数据？\n（取消则合并去重）`)) {
        const ids = new Set(records.map(r => r.id)); const merged = [...records];
        imported.forEach(r => { if (!ids.has(r.id)) merged.push(r); }); records = merged;
      } else { records = imported; }
      save(); renderAll(); alert('导入成功');
    } catch (err) { alert('导入失败：' + err.message); }
  };
  reader.readAsText(file); e.target.value = '';
};
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function renderAll() { renderList(); if (currentTab === 'stats') renderStats(); }
renderAll();
</script>
</body>
</html>
